services:
  api:
    build: .
    image: hydraulic-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro          # trained models
      - ./data/processed:/app/data/processed:ro  # feature table and splits
      - ./outbox:/app/outbox                   # work orders persist on your machine
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: hydraulic-dashboard:latest
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000                 # service name resolves inside the compose network
    depends_on:
      api:
        condition: service_healthy
      env_file:
      - .env
    restart: unless-stopped