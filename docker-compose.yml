services:
  api:
    build: .
    image: hydraulic-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro          # trained models
      - ./data/processed:/app/data/processed:ro  # feature table
      - ./outbox:/app/outbox                   # work orders persist on your machine
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped